# Local development stack for the footnotes plugin.
#
# Starts WordPress + MySQL and mounts this repository as the plugin under test.
#
#   docker compose up -d              # start
#   docker compose down               # stop (data persists)
#   docker compose down -v            # stop and wipe the database
#   ./.dev/setup.sh                   # full: start + install WP + activate + seed
#   docker compose run --rm wpcli <args>   # ad-hoc WP-CLI
#
# Site:  http://localhost:8080   (admin / admin)

services:
  db:
    image: mysql:8.0
    container_name: footnotes-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    ports:
      # Host 3306 is often taken by a local MySQL; expose on 3307 instead.
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.2-apache
    container_name: footnotes-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', true );
        define( 'SCRIPT_DEBUG', true );
    ports:
      - "8080:80"
    volumes:
      - wp_data:/var/www/html
      # Mount THIS repository as the plugin under development.
      - .:/var/www/html/wp-content/plugins/footnotes

  # Ad-hoc WP-CLI runner: `docker compose run --rm wpcli plugin list`
  wpcli:
    image: wordpress:cli-php8.2
    container_name: footnotes-wpcli
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/footnotes
    entrypoint: ["wp"]
    command: ["--help"]

volumes:
  db_data:
  wp_data:
